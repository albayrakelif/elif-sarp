<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katılım Formu · Elif & Sarp · 08.08.2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@200;300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e4ddd0;
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
    }

    .header {
      background: #f7f2e8;
      border-bottom: 1px solid #a8b8d8;
      text-align: center;
      padding: 24px 20px 20px;
    }

    .suptitle {
      font-weight: 300;
      font-size: 9px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #1a4fa0;
      margin-bottom: 6px;
    }

    .names {
      font-family: 'Great Vibes', cursive;
      font-size: 52px;
      color: #1a4fa0;
      line-height: 1;
      margin-bottom: 4px;
    }

    .meta {
      font-weight: 200;
      font-size: 9px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #1c2b4a;
      opacity: 0.6;
    }

    /* Google Form iframe */
    .form-wrap {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    iframe {
      width: 100%;
      /* Google Form yüksekliği içeriğe göre değişir, bu değeri artırabilirsin */
      height: 820px;
      border: none;
      display: block;
      background: #fff;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="suptitle">Katılım Formu</div>
    <div class="names">Elif &amp; Sarp</div>
    <div class="meta">08 · 08 · 2026 &nbsp;&middot;&nbsp; Büyükada</div>
  </div>

  <div class="form-wrap">
    <!--
      Google Form'u oluşturduktan sonra:
      Gönder → Bağlantı ikonu → "Bu formu yerleştir" sekmesi → src URL'ini kopyala
      ve aşağıdaki GOOGLE_FORM_EMBED_URL yerine yapıştır.
    -->
    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLSdBPOKqggCt0rV1S0suhyPtMipH2RIBc3wAZiJt-Cjq3rg6Eg/viewform?embedded=true"
      allowfullscreen
      loading="lazy">
    </iframe>
  </div>

</body>
</html>
